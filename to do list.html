<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Görev Yöneticisi</title><style>:root{--bg:#0f1318;--panel:#151b23;--text:#e6eef7;--muted:#9fb3c8;--accent:#4f7cf3;--accent-2:#3bd2a2;--danger:#ff5c77;--border:#243040;--chip:#1e2632;--focus:0 0 0 3px rgba(79,124,243,.35)}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:linear-gradient(180deg,#0e1217,#0f141a 35%,#0e1217);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}a{color:inherit}button{cursor:pointer}.container{max-width:920px;margin:40px auto;padding:0 16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.header{padding:22px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.header h1{margin:0;font-size:20px;letter-spacing:.2px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:var(--chip);border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:999px;font-size:12px}.stat b{color:var(--text)}.content{padding:20px}.form{display:grid;grid-template-columns:1fr 140px 140px auto;gap:10px}.form input,.form select,.form button{height:42px;background:#0d1116;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:0 12px;transition:border .2s,box-shadow .2s}.form input::placeholder{color:#6d7f93}.form input:focus,.form select:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}.form button{background:var(--accent);border-color:transparent;color:#fff;font-weight:600;padding:0 14px}.form button:hover{filter:brightness(1.05)}.form button:active{transform:translateY(1px)}.list{margin-top:16px}.empty{display:none;align-items:center;gap:10px;background:var(--chip);border:1px dashed var(--border);color:var(--muted);padding:14px;border-radius:12px}.empty svg{width:20px;height:20px;opacity:.75}.items{list-style:none;margin:0;padding:0}.item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#0d1116;margin-bottom:10px;transition:opacity .24s ease,transform .24s ease}.item.enter{animation:fadeIn .25s ease}.item.removing{opacity:0;transform:translateY(8px)}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.title{display:flex;align-items:center;gap:10px}.title .text{font-weight:600}.title .meta{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:12px;background:var(--chip);border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:999px}.chip.priority-low{color:#8ecb6f;border-color:#28402d;background:#152018}.chip.priority-med{color:#e7b05b;border-color:#463b22;background:#1c160d}.chip.priority-high{color:#ff8080;border-color:#5a2a31;background:#221013}.actions{display:flex;gap:8px}.btn{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:#121820;color:var(--text)}.btn:hover{border-color:#38507a}.btn.del{color:#fff;background:var(--danger);border-color:transparent}.checkbox{appearance:none;width:18px;height:18px;border-radius:4px;border:1px solid var(--border);background:#0b1015;display:grid;place-items:center;transition:border .2s,box-shadow .2s}.checkbox:focus{outline:none;box-shadow:var(--focus)}.checkbox:checked{border-color:var(--accent);background:var(--accent)}.checkbox:checked::after{content:"";width:10px;height:10px;background:#fff;border-radius:2px}.done .text{text-decoration:line-through;color:#a2b0c2}.footer{padding:16px 24px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.form{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:8px}.form select:nth-of-type(1){grid-column:1/2}.form select:nth-of-type(2){grid-column:2/3}.form button{grid-column:1/-1} .header{flex-direction:column;align-items:flex-start;gap:8px}}</style></head><body><div class="container"><div class="card"><div class="header"><h1>Görev Yöneticisi</h1><div class="stats" aria-live="polite"><span class="stat">Toplam: <b id="statTotal">0</b></span><span class="stat">Tamamlanan: <b id="statDone">0</b></span><span class="stat">Kalan: <b id="statLeft">0</b></span></div></div><div class="content"><form id="taskForm" class="form" autocomplete="off"><label class="sr-only" for="taskTitle">Görev başlığı</label><input id="taskTitle" name="title" type="text" placeholder="Görev başlığı..." aria-label="Görev başlığı"><label class="sr-only" for="taskCategory">Kategori</label><select id="taskCategory" name="category" aria-label="Kategori"><option value="İş">İş</option><option value="Kişisel">Kişisel</option><option value="Alışveriş">Alışveriş</option><option value="Diğer">Diğer</option></select><label class="sr-only" for="taskPriority">Öncelik</label><select id="taskPriority" name="priority" aria-label="Öncelik"><option value="Düşük">Düşük</option><option value="Orta" selected>Orta</option><option value="Yüksek">Yüksek</option></select><button type="submit" id="addBtn" aria-label="Görev ekle">Ekle</button></form><div class="list"><div id="emptyState" class="empty"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M7 7h10v2H7V7zm0 4h10v2H7v-2zm0 4h6v2H7v-2z" stroke="currentColor" stroke-width="1.5"/></svg><span>Henüz görev yok! Bir tane ekleyin.</span></div><ul id="taskList" class="items" aria-live="polite"></ul></div></div><div class="footer">Verileriniz tarayıcı LocalStorage\'da saklanır. Basit, hızlı ve duyarlı bir liste deneyimi.</div></div></div><script>(function(){"use strict";const STORAGE_KEY="todo_tasks_v1";const el={form:document.getElementById("taskForm"),title:document.getElementById("taskTitle"),category:document.getElementById("taskCategory"),priority:document.getElementById("taskPriority"),list:document.getElementById("taskList"),empty:document.getElementById("emptyState"),statTotal:document.getElementById("statTotal"),statDone:document.getElementById("statDone"),statLeft:document.getElementById("statLeft")};let tasks=load();function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function load(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):[]}catch(e){console.warn("LocalStorage okunamadı",e);return []}}function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks))}catch(e){console.warn("LocalStorage yazılamadı",e)}}function sortTasks(arr){const prioRank={"Yüksek":0,"Orta":1,"Düşük":2};return arr.slice().sort((a,b)=>{if(a.completed!==b.completed){return a.completed?1:-1}if(prioRank[a.priority]!==prioRank[b.priority]){return prioRank[a.priority]-prioRank[b.priority]}return (a.createdAt||0)-(b.createdAt||0)})}function render(){const total=tasks.length;const done=tasks.filter(t=>t.completed).length;const left=total-done;el.statTotal.textContent=String(total);el.statDone.textContent=String(done);el.statLeft.textContent=String(left);el.empty.style.display=total?"none":"flex";const ordered=sortTasks(tasks);el.list.innerHTML=ordered.map(t=>itemTemplate(t)).join("");bindItemEvents()}function itemTemplate(t){const doneClass=t.completed?" done":"";const prioClass=t.priority==="Düşük"?"priority-low":(t.priority==="Orta"?"priority-med":"priority-high");return `<li class="item enter${doneClass}" data-id="${t.id}"><input class="checkbox" type="checkbox" aria-label="Tamamla" ${t.completed?"checked":""}><div class="title"><span class="text">${escapeHtml(t.title)}</span><div class="meta"><span class="chip">${escapeHtml(t.category)}</span><span class="chip ${prioClass}">${escapeHtml(t.priority)}</span></div></div><div class="actions"><button class="btn del" aria-label="Sil">Sil</button></div></li>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function bindItemEvents(){Array.from(el.list.querySelectorAll(".item")).forEach(li=>{const id=li.getAttribute("data-id");const cb=li.querySelector(".checkbox");const del=li.querySelector(".del");cb.addEventListener("change",()=>{const t=tasks.find(x=>x.id===id);if(!t)return;t.completed=cb.checked;save();render()});del.addEventListener("click",()=>{li.classList.add("removing");const onDone=()=>{const idx=tasks.findIndex(x=>x.id===id);if(idx>-1){tasks.splice(idx,1);save();render()}li.removeEventListener("transitionend",onDone)};li.addEventListener("transitionend",onDone)})})}el.form.addEventListener("submit",e=>{e.preventDefault();const title=(el.title.value||"").trim();if(!title){el.title.focus();pulse(el.title);return}const category=el.category.value||"Diğer";const priority=el.priority.value||"Orta";const t={id:uid(),title,category,priority,completed:false,createdAt:Date.now()};tasks.push(t);save();el.title.value="";render()});function pulse(input){input.style.boxShadow="0 0 0 3px rgba(255,92,119,.35)";setTimeout(()=>{input.style.boxShadow=""},300)}document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden") save()});render();})();</script></body></html>
